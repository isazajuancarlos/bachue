[package]
name = "bachue-idp"
description = "Bachué — el IdP contenedorizado (F7, capa 2): un binario axum + SQLite + maud/htmx que USA la librería y expone la autenticación como servicio."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# La LIBRERÍA (capa 1): el IdP la usa, no reimplementa nada. La fachada re-exporta
# clave/sesion/segundopaso/defensas y los primitivos de guaca (dosfactores, freno).
bachue = { path = "../bachue" }
# OIDC (veta mindalá #1): firma del id_token y clave pública en JWKS. La rebanada 2 solo
# usa el JWKS (read-only); las rutas authorize/token son rebanadas posteriores.
bachue-oidc = { path = "../bachue-oidc" }
# Passkeys / WebAuthn (F3): el ANDAMIAJE de las dos ceremonias (registro + assertion), con
# la firma tras un trait, y la `impl` ES256 (ECDSA P-256) de ese trait. El IdP solo orquesta
# las ceremonias contra HTTP + DB; la cripto y el parseo COSE/CBOR viven en los crates.
bachue-passkey = { path = "../bachue-passkey" }
bachue-passkey-es256 = { path = "../bachue-passkey-es256" }

# El stack de la directiva 26: axum + SQLx/SQLite + maud/htmx, un solo binario.
axum = "0.8"
maud = { version = "0.27", features = ["axum"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["compression-gzip", "trace"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
# El JWKS se sirve como JSON (axum::Json<serde_json::Value>).
serde_json = "1"
# Construir las query-strings de redirección OIDC (code/state, next) bien codificadas, sin
# concatenar a mano. Ya es dep transitiva de axum (Query/Form la usan).
serde_urlencoded = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Comparación en TIEMPO CONSTANTE del secreto compartido de /aprovisionar (no filtrar
# por el primer byte que difiere). Ya está en el árbol (dep transitiva de la cripto).
subtle = "2"
# Deriva el `userHandle` de WebAuthn estable por usuario (SHA-256 del secreto ‖ etiqueta ‖
# usuario_id): no revela el nombre de usuario y no exige almacenarlo. Ya está en el árbol
# (dep transitiva de bachue-passkey / la cripto).
sha2 = "0.10"

[dev-dependencies]
# E2E: arranca el BINARIO real y le habla como el mundo (directiva 28).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json"] }
# AUTENTICADOR DE SOFTWARE para el E2E de passkey: genera un par ES256, firma el reto y arma
# el attestationObject/assertion EXACTAMENTE como lo haría el navegador, para hablarle a las
# ceremonias por HTTP. Prueba el camino SERVIDOR entero (endpoints→DB→verificación→sesión);
# el JS del navegador y el dibujo de la pantalla se prueban aparte con Chromium + autenticador
# virtual (ver `tests/README-e2e-navegador.md`).
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
getrandom = "0.4"
sha2 = "0.10"

[lints]
workspace = true
